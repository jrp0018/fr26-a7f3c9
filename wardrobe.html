:root{
  --paper:#F7F6F3;--card:#FFFFFF;--ink:#111110;
  --verm:#C43E1B;--g1:#5E5C57;--g2:#75736E;--hair:#E2E0DB;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#131313;--card:#1A1A19;--ink:#EDEBE6;
        --verm:#E85C33;--g1:#9B9891;--g2:#8D8A84;--hair:rgba(237,235,230,.14)}
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:MonoG,ui-monospace,monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(48px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
.top{width:100%;max-width:330px;text-align:center}
.eyebrow{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--g2)}
h1{
  font-family:SerifG,Georgia,serif;font-weight:400;font-size:44px;
  line-height:.94;letter-spacing:-.03em;margin-top:14px;
}
h1 em{font-style:italic}
.lab{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--g2);margin-top:34px}

/* --- the dots are squares, same language as the rail --- */
.dots{display:flex;gap:14px;justify-content:center;margin-top:16px;height:13px}
.dot{
  width:13px;height:13px;border:1.5px solid var(--ink);
  background:transparent;transition:background .12s ease,border-color .12s ease;
}
.dot.on{background:var(--ink)}
.bad .dot{border-color:var(--verm)}
.bad .dot.on{background:var(--verm)}
.bad{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)} 40%,60%{transform:translateX(7px)}
}
.msg{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--verm);
     margin-top:16px;min-height:12px;opacity:0;transition:opacity .18s}
.msg.on{opacity:1}

/* --- keypad --- */
.pad{
  display:grid;grid-template-columns:repeat(3,84px);
  gap:14px;justify-content:center;margin-top:8px;
}
.k{
  height:70px;border:1px solid var(--hair);background:transparent;
  font-family:SerifG,Georgia,serif;font-size:29px;font-weight:400;
  letter-spacing:-.02em;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .09s ease,color .09s ease,border-color .09s ease;
}
.k:active,.k.press{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.k.blank{border:0;pointer-events:none}
.k.fn{
  font-family:MonoG,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--g2);
}
.k.fn:active{background:transparent;color:var(--ink);border-color:var(--g2)}
.foot{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--g2);text-align:center}
.working .pad{opacity:.35;pointer-events:none;transition:opacity .2s}
@media (max-height:700px){
  h1{font-size:34px} .lab{margin-top:22px} .k{height:60px} .pad{grid-template-columns:repeat(3,76px)}
}

  var buf="", busy=false;
  var dots=document.getElementById("dots"),
      msg=document.getElementById("msg"),
      lab=document.getElementById("lab"),
      pad=document.getElementById("pad"),
      top_=document.querySelector(".top");

  for(var i=0;i<N;i++){var d=document.createElement("span");d.className="dot";dots.appendChild(d);}
  var cells=dots.querySelectorAll(".dot");

  function paint(){
    for(var i=0;i<N;i++) cells[i].classList.toggle("on", i<buf.length);
  }
  function b2a(s){var x=atob(s),u=new Uint8Array(x.length);
    for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i);return u;}

  async function unlock(pass){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
    var k=await crypto.subtle.deriveKey(

    try{localStorage.setItem(STORE,pass);}catch(e){}
    document.open();document.write(html);document.close();

    busy=false;
    document.body.classList.remove("working");
    top_.classList.add("bad");
    msg.textContent="Try again"; msg.classList.add("on");

      try{localStorage.removeItem(STORE);}catch(e){}
      if(quiet){busy=false;document.body.classList.remove("working");buf="";paint();}
      else fail();
    });
  }

  function push(d){
    if(busy||buf.length>=N) return;
    buf+=d; paint();
    if(navigator.vibrate) navigator.vibrate(6);
    if(buf.length===N) setTimeout(function(){submit(false);},140);
